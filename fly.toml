# Fly.io: API (process "app") e worker de liquidação (process "worker") a partir do mesmo Dockerfile.
# Segredos (SECRET_KEY, AUDIT_HMAC_KEY, DATABASE_URL) ficam em `fly secrets`, nunca aqui.
app = "verz-api"
primary_region = "gru"

[deploy]
  # Roda numa máquina temporária antes de cada versão nova entrar no ar.
  release_command = "sh -c 'python manage.py migrate && python manage.py createcachetable'"

[env]
  ALLOWED_HOSTS = "verz-api.fly.dev"
  # O proxy da Fly acrescenta o IP do cliente ao X-Forwarded-For; 1 = confia só nesse último item (ver README).
  NUM_PROXIES = "1"

[processes]
  app = "uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --no-proxy-headers --no-server-header"
  worker = "python manage.py run_settlement"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["app"]
  # Sempre ligada: parar a máquina derruba as conexões de tempo real (SSE).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # 512 MB: cada login com Argon2 usa ~100 MB; com 256 MB, logins simultâneos derrubariam a máquina.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
