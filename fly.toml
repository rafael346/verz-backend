# Fly.io: API (process "app") e worker de liquidação (process "worker") a partir do mesmo Dockerfile.
# Segredos (SECRET_KEY, AUDIT_HMAC_KEY, DATABASE_URL) ficam em `fly secrets`, nunca aqui.
app = "verz-api"
primary_region = "gru"

[deploy]
  # Roda numa máquina temporária antes de cada versão nova entrar no ar.
  release_command = "sh -c 'python manage.py migrate && python manage.py createcachetable'"

[env]
  ALLOWED_HOSTS = "verz-api.fly.dev"
  # A Fly acrescenta ao X-Forwarded-For o IP do cliente e depois o da própria borda (66.241.x); 2 = pega o do cliente
  # e ignora o que ele forjar antes (conferido em 2026-10-27, ver README).
  NUM_PROXIES = "2"

[processes]
  app = "uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --no-proxy-headers --no-server-header"
  worker = "python manage.py run_settlement"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["app"]
  # Sempre ligada: parar a máquina derruba as conexões de tempo real (SSE).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # 512 MB: com 256 MB a API morreu por falta de memória (OOM) no primeiro login; o Argon2 usa ~100 MB por login.
  processes = ["app"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  # O worker não faz login (sem Argon2), então 256 MB bastam.
  processes = ["worker"]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
