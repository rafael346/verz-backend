services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: verz
      POSTGRES_USER: verz
      POSTGRES_PASSWORD: verz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verz"]
      interval: 5s
      retries: 10

  backend:
    build: .
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    # clearsessions apaga sessões expiradas (o Django não faz isso sozinho); roda a cada 24 h.
    # shortcut: o loop não é supervisionado (o Docker só vigia o gunicorn); mover para o worker na tarefa 7.
    command: >
      sh -c "python manage.py migrate || exit 1;
      (while true; do python manage.py clearsessions; sleep 86400; done) &
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --no-control-socket --workers 1 --threads 8"
    ports:
      - "8000:8000"

volumes:
  pgdata:
