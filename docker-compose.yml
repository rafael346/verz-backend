services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: verz
      POSTGRES_USER: verz
      POSTGRES_PASSWORD: verz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verz"]
      interval: 5s
      retries: 10

  backend:
    build: .
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --no-control-socket --workers 1 --threads 8"
    ports:
      - "8000:8000"

  # Encerra e liquida lotes vencidos (D05) e limpa sessões expiradas a cada 24 h.
  worker:
    build: .
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started  # o backend aplica as migrações; até lá o loop só registra a falha e tenta de novo
    command: python manage.py run_settlement
    restart: unless-stopped

volumes:
  pgdata:
