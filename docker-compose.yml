services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: verz
      POSTGRES_USER: verz
      POSTGRES_PASSWORD: verz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verz"]
      interval: 5s
      retries: 10

  backend:
    build: .
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
